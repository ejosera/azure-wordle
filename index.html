<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Azure Wordle</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header><h1>AZURE WORDLE</h1></header>
    <nav class="modes" aria-label="Modo de juego">
      <button id="daily-mode" type="button" aria-pressed="true">📅 Wordle diario</button>
      <button id="free-mode" type="button" aria-pressed="false">🎮 Partida libre</button>
    </nav>
    <div id="daily-clock" class="daily-clock">
    <span>⏳ Próxima palabra en:</span>
    <strong id="countdown">--:--:--</strong>
    <small>El desafío cambia cada día a las 06:00 (ZGZ)</small>
    </div>
    <p id="day-info"></p>
    <button id="new-game" type="button" hidden>Nueva partida libre</button>
    <p id="message" role="status" aria-live="polite">Cargando diccionario…</p>
    <button id="share-whatsapp" type="button" hidden>
    📲 Compartir por WhatsApp
    </button>
    <section id="board" aria-label="Tablero de Wordle"></section>
    <section id="keyboard" aria-label="Teclado virtual"></section>
    <p class="help">Verde: posición correcta · Amarillo: otra posición · Gris: no aparece<br>Haz clic en una casilla para colocar una letra; usa ← y → para moverte.</p>
  </main>
</body>
</html>
